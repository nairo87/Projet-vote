<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Console Admin — Votes</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --gold: #c9a84c;
            --gold-light: #e8d9a0;
            --gold-dim: rgba(201,168,76,0.35);
            --gold-glow: rgba(201,168,76,0.12);
            --bg-card: rgba(15,20,35,0.82);
            --bg-deep: rgba(8,12,22,0.97);
            --red: rgba(255,82,82,0.85);
            --red-dim: rgba(255,82,82,0.35);
            --green: rgba(80,220,120,0.9);
            --text: #f0ece4;
            --text-muted: rgba(240,236,228,0.55);
        }

        body {
            font-family: 'Lato', sans-serif;
            background-image: url('fond_bidrasil__2_.svg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #0a0f19;
            min-height: 100vh;
            padding: 40px 24px;
            color: var(--text);
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(8,12,22,0.72);
            backdrop-filter: blur(1px);
            z-index: 0;
            pointer-events: none;
        }

        body > * { position: relative; z-index: 1; }

        #lock-screen {
            position: fixed;
            inset: 0;
            background: rgba(8,12,22,0.97);
            z-index: 9999;
            display: flex;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
        }

        .lock-box {
            background: var(--bg-card);
            border: 1px solid var(--gold-dim);
            border-radius: 8px;
            padding: 48px 40px;
            width: 340px;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
        }

        .lock-icon { font-size: 2.2rem; margin-bottom: 20px; }

        .lock-title {
            font-family: 'Cinzel', serif;
            font-size: 1.1rem;
            font-weight: 800;
            letter-spacing: 0.12em;
            color: var(--gold-light);
            margin-bottom: 8px;
        }

        .lock-sub {
            font-size: 0.78rem;
            color: var(--text-muted);
            margin-bottom: 28px;
            line-height: 1.6;
        }

        #lock-input {
            width: 100%;
            background: rgba(8,12,22,0.8);
            border: 1px solid var(--gold-dim);
            color: var(--text);
            font-family: 'Lato', sans-serif;
            font-size: 1.1rem;
            padding: 12px 16px;
            border-radius: 4px;
            outline: none;
            text-align: center;
            letter-spacing: 0.3em;
            margin-bottom: 14px;
            transition: border-color 0.2s;
        }

        #lock-input:focus { border-color: var(--gold); }
        .lock-error { font-size: 0.78rem; color: var(--red); margin-top: 10px; min-height: 1.2em; }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 40px;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
            flex-wrap: wrap;
            gap: 16px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-weight: 800;
            font-size: clamp(1.1rem, 2.5vw, 1.6rem);
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--gold-light);
            text-shadow: 0 0 30px rgba(180,140,60,0.5);
        }

        h1 span {
            display: block;
            font-size: 0.6em;
            font-weight: 600;
            color: var(--text-muted);
            letter-spacing: 0.2em;
            margin-top: 3px;
        }

        .btn-retour {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--gold);
            font-size: 0.82rem;
            letter-spacing: 0.1em;
            text-decoration: none;
            border: 1px solid var(--gold-dim);
            padding: 8px 16px;
            border-radius: 3px;
            transition: all 0.2s;
            cursor: pointer;
            background: none;
            font-family: 'Lato', sans-serif;
        }
        .btn-retour:hover { border-color: var(--gold); background: var(--gold-glow); }

        .divider {
            width: 100%; height: 1px;
            background: linear-gradient(90deg, transparent, var(--gold-dim), transparent);
            margin: 0 0 36px;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-bottom: 28px;
            max-width: 1100px;
            margin-left: auto;
            margin-right: auto;
        }

        .stat-card {
            background: var(--bg-card);
            border: 1px solid var(--gold-dim);
            border-radius: 4px;
            padding: 18px;
            text-align: center;
            backdrop-filter: blur(10px);
        }

        .stat-value {
            font-family: 'Cinzel', serif;
            font-size: 2rem;
            font-weight: 800;
            color: var(--gold);
            line-height: 1;
        }

        .stat-label {
            font-size: 0.68rem;
            font-weight: 700;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-top: 6px;
        }

        .admin-layout {
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 24px;
            max-width: 1100px;
            margin: 0 auto;
            align-items: start;
        }

        @media (max-width: 860px) { .admin-layout { grid-template-columns: 1fr; } }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--gold-dim);
            border-radius: 6px;
            overflow: hidden;
            backdrop-filter: blur(12px);
            box-shadow: 0 8px 40px rgba(0,0,0,0.45);
        }

        .panel-header {
            padding: 16px 20px;
            border-bottom: 1px solid var(--gold-dim);
            background: rgba(201,168,76,0.05);
            display: flex; align-items: center; justify-content: space-between;
        }

        .panel-title {
            font-family: 'Cinzel', serif;
            font-size: 0.76rem;
            font-weight: 600;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: var(--gold);
        }

        .panel-count {
            font-size: 0.7rem;
            color: var(--text-muted);
            background: rgba(201,168,76,0.08);
            border: 1px solid var(--gold-dim);
            padding: 2px 10px;
            border-radius: 20px;
        }

        .panel-body { padding: 20px; }

        .form-group { margin-bottom: 13px; }

        label {
            display: block;
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: var(--text-muted);
            margin-bottom: 5px;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(8,12,22,0.7);
            border: 1px solid rgba(201,168,76,0.22);
            color: var(--text);
            font-family: 'Lato', sans-serif;
            font-size: 0.88rem;
            padding: 9px 13px;
            border-radius: 3px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus {
            border-color: rgba(201,168,76,0.65);
            box-shadow: 0 0 0 3px rgba(201,168,76,0.07);
        }

        .btn {
            display: inline-flex; align-items: center; gap: 7px;
            padding: 9px 18px;
            border-radius: 3px;
            font-family: 'Lato', sans-serif;
            font-weight: 700;
            font-size: 0.76rem;
            letter-spacing: 0.13em;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s ease;
            border: 1px solid;
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(201,168,76,0.22), rgba(201,168,76,0.08));
            border-color: rgba(201,168,76,0.55);
            color: var(--gold-light);
            width: 100%;
            justify-content: center;
            margin-top: 6px;
        }
        .btn-primary:hover { border-color: var(--gold); box-shadow: 0 0 18px rgba(201,168,76,0.22); }

        .btn-danger {
            background: transparent;
            border-color: var(--red-dim);
            color: var(--red);
            padding: 5px 11px;
            font-size: 0.68rem;
        }
        .btn-danger:hover { border-color: var(--red); box-shadow: 0 0 10px rgba(255,82,82,0.18); }

        .btn-sm {
            background: var(--gold-glow);
            border-color: var(--gold-dim);
            color: var(--gold-light);
            padding: 6px 12px;
            font-size: 0.68rem;
        }
        .btn-sm:hover { border-color: var(--gold); }

        .phase-item {
            border: 1px solid var(--gold-dim);
            border-radius: 4px;
            margin-bottom: 10px;
            overflow: hidden;
            transition: border-color 0.2s;
        }
        .phase-item:hover { border-color: rgba(201,168,76,0.5); }

        .phase-item-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 11px 15px;
            background: rgba(201,168,76,0.04);
            cursor: pointer; gap: 10px;
        }

        .phase-item-title {
            font-family: 'Cinzel', serif;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--gold-light);
            letter-spacing: 0.05em;
            flex: 1;
        }

        .phase-item-desc { font-size: 0.72rem; color: var(--text-muted); margin-top: 2px; }

        .phase-arrow { font-size: 0.65rem; color: var(--text-muted); transition: transform 0.2s; }
        .phase-item.open .phase-arrow { transform: rotate(180deg); }

        .phase-projects {
            display: none;
            padding: 12px 15px;
            border-top: 1px solid rgba(201,168,76,0.1);
            background: rgba(0,0,0,0.18);
        }
        .phase-item.open .phase-projects { display: block; }

        .project-row {
            display: flex; align-items: center; justify-content: space-between;
            padding: 7px 11px;
            border: 1px solid rgba(201,168,76,0.1);
            border-radius: 3px;
            margin-bottom: 5px;
            background: rgba(15,20,35,0.5);
            gap: 10px;
        }

        .project-row-info { flex: 1; min-width: 0; }
        .project-row-name { font-size: 0.8rem; font-weight: 700; color: var(--gold-light); }
        .project-row-desc { font-size: 0.7rem; color: var(--text-muted); margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .add-project-form {
            display: none;
            padding: 13px;
            border: 1px dashed rgba(201,168,76,0.22);
            border-radius: 4px;
            margin-top: 8px;
            background: rgba(201,168,76,0.02);
        }
        .add-project-form.visible { display: block; }

        .empty {
            text-align: center;
            padding: 26px 16px;
            color: var(--text-muted);
            font-size: 0.8rem;
            letter-spacing: 0.06em;
            border: 1px dashed rgba(201,168,76,0.18);
            border-radius: 4px;
        }

        #toast {
            position: fixed;
            bottom: 28px; right: 28px;
            padding: 11px 20px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: 700;
            letter-spacing: 0.08em;
            z-index: 9999;
            transform: translateY(16px);
            opacity: 0;
            transition: all 0.28s ease;
            pointer-events: none;
        }
        #toast.show { transform: translateY(0); opacity: 1; }
        #toast.success { background: rgba(80,220,120,0.13); border: 1px solid rgba(80,220,120,0.45); color: var(--green); }
        #toast.error   { background: rgba(255,82,82,0.13);  border: 1px solid rgba(255,82,82,0.45);  color: var(--red); }

        #confirm-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.65); z-index: 9999; align-items: center; justify-content: center; }
        #confirm-modal.open { display: flex; }

        .confirm-box {
            background: var(--bg-deep);
            border: 1px solid rgba(255,82,82,0.35);
            border-radius: 6px;
            padding: 30px;
            width: 300px;
            text-align: center;
        }

        .confirm-title { font-family: 'Cinzel', serif; font-size: 0.88rem; color: var(--text); margin-bottom: 10px; letter-spacing: 0.08em; }
        .confirm-msg { font-size: 0.8rem; color: var(--text-muted); line-height: 1.6; margin-bottom: 22px; }
        .confirm-actions { display: flex; gap: 10px; justify-content: center; }
    </style>
</head>
<body>

<div id="lock-screen">
    <div class="lock-box">
        <div class="lock-icon">🔐</div>
        <div class="lock-title">Console Admin</div>
        <div class="lock-sub">Accès réservé aux administrateurs.</div>
        <input type="password" id="lock-input" placeholder="••••••" onkeydown="if(event.key==='Enter')unlock()">
        <button class="btn btn-primary" onclick="unlock()">Accéder</button>
        <div class="lock-error" id="lock-error"></div>
    </div>
</div>

<div id="confirm-modal">
    <div class="confirm-box">
        <div class="confirm-title">Confirmer la suppression</div>
        <div class="confirm-msg" id="confirm-msg">Êtes-vous sûr ?</div>
        <div class="confirm-actions">
            <button class="btn btn-danger" onclick="confirmDelete()">Supprimer</button>
            <button class="btn btn-sm" onclick="closeConfirm()">Annuler</button>
        </div>
    </div>
</div>

<div id="toast"></div>

<div class="header">
    <h1>Console Admin<span>Gestion des votes</span></h1>
    <button class="btn-retour" onclick="window.location.href='index.html'">← Retour au site</button>
</div>
<div class="divider"></div>

<div class="stats-grid">
    <div class="stat-card">
        <div class="stat-value" id="stat-phases">0</div>
        <div class="stat-label">Phases</div>
    </div>
    <div class="stat-card">
        <div class="stat-value" id="stat-projets">0</div>
        <div class="stat-label">Projets</div>
    </div>
</div>

<div class="admin-layout">

    <div>
        <div class="panel">
            <div class="panel-header"><span class="panel-title">Ajouter une phase</span></div>
            <div class="panel-body">
                <div class="form-group">
                    <label>Titre</label>
                    <input type="text" id="new-phase-titre" placeholder="ex : Phase 4">
                </div>
                <div class="form-group">
                    <label>Description</label>
                    <input type="text" id="new-phase-desc" placeholder="ex : Projets santé & sport">
                </div>
                <button class="btn btn-primary" onclick="ajouterPhase()">+ Créer la phase</button>
            </div>
        </div>
    </div>

    <div class="panel">
        <div class="panel-header">
            <span class="panel-title">Phases & projets</span>
            <span class="panel-count" id="phase-count">0 phases</span>
        </div>
        <div class="panel-body" id="phases-list">
            <div class="empty">Aucune phase.</div>
        </div>
    </div>
</div>

<script>
const ADMIN_PASSWORD = "1302";

const configDefaut = {
    phases: {
        1: {
            titre: "Phase 1 — Écologie & Mobilité",
            desc: "Projets écologie & mobilité",
            projets: [
                { id: "projet1", nom: "Projet 1", desc: "Application mobile pour l'écologie" },
                { id: "projet2", nom: "Projet 2", desc: "Solution de covoiturage local" },
                { id: "projet3", nom: "Projet 3", desc: "Vélos en libre service connectés" }
            ]
        },
        2: {
            titre: "Phase 2 — Éducation & Culture",
            desc: "Projets éducation & culture",
            projets: [
                { id: "projet1", nom: "Projet 1", desc: "Plateforme éducative en ligne" },
                { id: "projet2", nom: "Projet 2", desc: "Bibliothèque numérique gratuite" },
                { id: "projet3", nom: "Projet 3", desc: "Réseau d'échange de compétences" }
            ]
        },
        3: {
            titre: "Phase 3 — Tech & Innovation",
            desc: "Projets tech & innovation",
            projets: [
                { id: "projet1", nom: "Projet 1", desc: "IA pour la santé préventive" },
                { id: "projet2", nom: "Projet 2", desc: "Impression 3D solidaire" },
                { id: "projet3", nom: "Projet 3", desc: "Réseau mesh communautaire" }
            ]
        }
    }
};

let config = JSON.parse(localStorage.getItem('admin_vote_config') || 'null') || configDefaut;

function unlock() {
    const val = document.getElementById('lock-input').value;
    if (val === ADMIN_PASSWORD) {
        document.getElementById('lock-screen').style.display = 'none';
        render();
    } else {
        const err = document.getElementById('lock-error');
        err.textContent = 'Mot de passe incorrect.';
        document.getElementById('lock-input').value = '';
        setTimeout(() => err.textContent = '', 2500);
    }
}

function save() {
    localStorage.setItem('admin_vote_config', JSON.stringify(config));
}

let openPhases = new Set();

function render() {
    const phases = config.phases;
    const keys = Object.keys(phases);
    const totalProjets = keys.reduce((acc, k) => acc + (phases[k].projets || []).length, 0);

    document.getElementById('stat-phases').textContent = keys.length;
    document.getElementById('stat-projets').textContent = totalProjets;
    document.getElementById('phase-count').textContent = keys.length + ' phase' + (keys.length !== 1 ? 's' : '');

    const list = document.getElementById('phases-list');
    if (keys.length === 0) {
        list.innerHTML = '<div class="empty">Aucune phase. Créez-en une à gauche.</div>';
        return;
    }

    list.innerHTML = keys.map(k => {
        const phase = phases[k];
        const projets = phase.projets || [];
        return `
        <div class="phase-item" id="phase-item-${k}">
            <div class="phase-item-header" onclick="togglePhase('${k}')">
                <div style="flex:1">
                    <div class="phase-item-title">${esc(phase.titre)}</div>
                    <div class="phase-item-desc">${esc(phase.desc)} · ${projets.length} projet${projets.length !== 1 ? 's' : ''}</div>
                </div>
                <div onclick="event.stopPropagation()">
                    <button class="btn btn-danger" onclick="askDelete('phase','${k}')">✕</button>
                </div>
                <span class="phase-arrow">▼</span>
            </div>
            <div class="phase-projects">
                ${projets.length === 0 ? '<div class="empty" style="padding:12px 0">Aucun projet.</div>' : ''}
                ${projets.map((p, i) => `
                <div class="project-row">
                    <div class="project-row-info">
                        <div class="project-row-name">${esc(p.nom)}</div>
                        <div class="project-row-desc" title="${esc(p.desc)}">id: ${esc(p.id)} — ${esc(p.desc)}</div>
                    </div>
                    <button class="btn btn-danger" onclick="askDelete('projet','${k}',${i})">✕</button>
                </div>`).join('')}
                <button class="btn btn-sm" style="margin-top:8px;width:100%;justify-content:center;" onclick="toggleAddProject('${k}')">+ Ajouter un projet</button>
                <div class="add-project-form" id="add-form-${k}">
                    <div class="form-group"><label>Nom</label><input type="text" id="pnom-${k}" placeholder="ex : Projet 4"></div>
                    <div class="form-group"><label>Description</label><input type="text" id="pdesc-${k}" placeholder="ex : Une initiative locale..."></div>
                    <div class="form-group"><label>Identifiant (id)</label><input type="text" id="pid-${k}" placeholder="ex : projet4"></div>
                    <div style="display:flex;gap:8px;margin-top:8px;">
                        <button class="btn btn-primary" style="flex:1" onclick="ajouterProjet('${k}')">Ajouter</button>
                        <button class="btn btn-danger" onclick="toggleAddProject('${k}')">Annuler</button>
                    </div>
                </div>
            </div>
        </div>`;
    }).join('');

    openPhases.forEach(k => {
        const el = document.getElementById(`phase-item-${k}`);
        if (el) el.classList.add('open');
    });
}

function togglePhase(k) {
    const el = document.getElementById(`phase-item-${k}`);
    el.classList.toggle('open');
    if (el.classList.contains('open')) openPhases.add(k); else openPhases.delete(k);
}

function toggleAddProject(k) {
    document.getElementById(`add-form-${k}`).classList.toggle('visible');
}

function ajouterPhase() {
    const titre = document.getElementById('new-phase-titre').value.trim();
    const desc  = document.getElementById('new-phase-desc').value.trim();
    if (!titre) { toast('Le titre est obligatoire.', 'error'); return; }
    const keys = Object.keys(config.phases).map(Number);
    const newKey = keys.length > 0 ? Math.max(...keys) + 1 : 1;
    config.phases[newKey] = { titre, desc: desc || '', projets: [] };
    save();
    openPhases.add(String(newKey));
    document.getElementById('new-phase-titre').value = '';
    document.getElementById('new-phase-desc').value = '';
    render();
    toast('Phase créée !', 'success');
}

function ajouterProjet(phaseKey) {
    const nom  = document.getElementById(`pnom-${phaseKey}`).value.trim();
    const desc = document.getElementById(`pdesc-${phaseKey}`).value.trim();
    const id   = document.getElementById(`pid-${phaseKey}`).value.trim();
    if (!nom) { toast('Le nom est obligatoire.', 'error'); return; }
    if (!id)  { toast("L'identifiant est obligatoire.", 'error'); return; }
    if (!/^[a-zA-Z0-9_-]+$/.test(id)) { toast("L'id : lettres, chiffres, - et _ uniquement.", 'error'); return; }
    config.phases[phaseKey].projets.push({ id, nom, desc: desc || '' });
    save(); render();
    toast('Projet ajouté !', 'success');
}

let pendingDelete = null;

function askDelete(type, phaseKey, idx) {
    const msg = document.getElementById('confirm-msg');
    if (type === 'phase') {
        msg.textContent = `Supprimer "${config.phases[phaseKey]?.titre}" et tous ses projets ?`;
        pendingDelete = { type: 'phase', phaseKey };
    } else {
        msg.textContent = `Supprimer le projet "${config.phases[phaseKey]?.projets[idx]?.nom}" ?`;
        pendingDelete = { type: 'projet', phaseKey, idx };
    }
    document.getElementById('confirm-modal').classList.add('open');
}

function confirmDelete() {
    if (!pendingDelete) return;
    const { type, phaseKey, idx } = pendingDelete;
    if (type === 'phase') { delete config.phases[phaseKey]; openPhases.delete(String(phaseKey)); }
    else config.phases[phaseKey].projets.splice(idx, 1);
    save(); render(); closeConfirm();
    toast('Supprimé.', 'success');
}

function closeConfirm() {
    document.getElementById('confirm-modal').classList.remove('open');
    pendingDelete = null;
}

function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `show ${type}`;
    clearTimeout(el._t);
    el._t = setTimeout(() => el.className = '', 2800);
}

function esc(str) {
    return String(str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('lock-input').focus();
</script>
